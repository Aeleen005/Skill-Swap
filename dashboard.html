 <!-- dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - SkillSwap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="discover.html" class="logo">🤝 Skill<span>Swap</span></a>
        <ul class="nav-links">
            <li><a href="discover.html">Discover</a></li>
            <li><a href="dashboard.html" class="active">Dashboard</a></li>
            <li><a href="profile.html">My Profile</a></li>
        </ul>
        <button class="btn-primary" onclick="window.location.href='discover.html?open=true'">+ Post a Skill</button>
    </nav>

    <main class="container">
        <div class="page-header">
            <h1>Your Activity Central</h1>
            <p>Monitor your active trade agreements and historical logs.</p>
        </div>

        <div class="layout-split">
            <!-- Performance Statistics Mini Panel -->
            <aside class="panel">
                <h3 style="margin-bottom: 1rem;">Overview</h3>
                <div style="margin-bottom: 1rem;">
                    <small style="color: var(--text-muted);">Active Connections</small>
                    <p id="activeCount" style="font-size: 1.75rem; font-weight: 700; color: var(--primary-color);">2</p>
                </div>
                <div>
                    <small style="color: var(--text-muted);">Total Completed Trades</small>
                    <p id="completedCount" style="font-size: 1.75rem; font-weight: 700;">14</p>
                </div>
            </aside>

            <!-- Active Swap Progress Trackers & Chat Engine Box -->
            <div style="display: flex; flex-direction: column; width: 100%;">
                <section id="tradesContainer" style="display: flex; flex-direction: column; gap: 1.5rem; width: 100%;">
                    <h2>In Progress Connections</h2>
                
                </section>
                <section class="chat-room-container">
                    <div class="chat-header">
                        <div>Chart Room: <span id="chatPartnerName">Sarah J.</span></div>
                        <small id="chatConnectionContext" style="opacity: 0.85;">Learning Python</small>
                    </div>
                    
                    <div class="chat-messages" id="chatHistory">
                    </div>

                    <form class="chat-input-bar" id="chatForm">
                        <input type="text" id="chatInputField" placeholder="Type a message to your match..." autocomplete="off" required>
                        <button type="submit" class="btn-primary">Send</button>
                    </form>
                </section>
            </div>
        </div>
    </main>

    <script src="dashboard.js"></script>
</body>
</html>
