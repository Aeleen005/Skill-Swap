 <!-- profile.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - SkillSwap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="discover.html" class="logo"> Skill<span>Swap</span></a>
        <ul class="nav-links">
            <li><a href="discover.html">Discover</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="profile.html" class="active">My Profile</a></li>
        </ul>
        <button class="btn-primary" onclick="window.location.href='discover.html?open=true'">+ Post a Skill</button>
    </nav>

    <main class="container">
        <div class="layout-split">
            <!-- Account Overview Visual Side Display -->
            <div class="panel" style="text-align: center;">
                <div style="width: 100px; height: 100px; background-color: var(--primary-color); border-radius: 50%; margin: 0 auto 1rem auto; display: flex; align-items: center; justify-content: center; color: white; font-size: 2.5rem; font-weight: bold;">
                    JD
                </div>
                <h3 id="sideDisplayName">Jane Doe</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">UI Designer & Hobbyist Baker</p>
                <hr style="border: 0; border-top: 1px solid var(--border-color); margin-bottom: 1rem;">
                <p style="font-size: 0.85rem; color: var(--text-muted);">Member since October 2026</p>
            </div>

            <!-- Profile Field Management Engine Form -->
            <div class="panel">
                <h2 style="margin-bottom: 1.5rem;">Profile Settings</h2>
                <form id="profileForm">
                    <div class="form-group">
                        <label for="profileName">Full Name</label>
                        <input type="text" id="profileName" value="Aeleen Okisai" required>
                    </div>
                    <div class="form-group">
                        <label for="profileEmail">Email Address</label>
                        <input type="email" id="profileEmail" value="aeleeokisai@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="profileBio">Bio / Headline</label>
                        <textarea id="profileBio" rows="4">UI Designer looking to trade design layout concepts for modern developer stacks like Node.js.</textarea>
                    </div>
                    <button type="submit" class="btn-primary">Save Structural Changes</button>
                </form>
            </div>
        </div>
    </main>

    <script src="profile.js"></script>
</body>
</html>
